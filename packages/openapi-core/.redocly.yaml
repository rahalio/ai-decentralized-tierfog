apis:
  identity:
    root: src/identity.yaml
  sites:
    root: src/sites.yaml
  tiers:
    root: src/tiers.yaml
  protocol:
    root: src/protocol.yaml
  jobs:
    root: src/jobs.yaml
  fl:
    root: src/fl.yaml
  addressing:
    root: src/addressing.yaml
  trust:
    root: src/trust.yaml
  provenance:
    root: src/provenance.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
